<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تسجيل الحضور — تعليمات الترعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, where, orderBy, limit,
    getDocs, serverTimestamp, Timestamp, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ============================================================
  // ⚠️ عدّل الإعدادات دي بقيم مشروع Firebase بتاعك (من لوحة تحكم Firebase)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBGSGTSL-lVdx54BIECEbbVljXuqCjuu_4",
    authDomain: "attendance-terra.firebaseapp.com",
    projectId: "attendance-terra",
    storageBucket: "attendance-terra.firebasestorage.app",
    messagingSenderId: "403868956775",
    appId: "1:403868956775:web:1cefb35a53c72033057cc2"
  };

  // قائمة موظفين احتياطية (تُستخدم فقط لو فشل تحميل القائمة من قاعدة البيانات)
  const FALLBACK_EMPLOYEES = [
    "يويو", "Hagoraa", "Nermin", "Y", "eldeeb", "اسلام الشربيني", "جمعه انور محمد"
  ];

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const EVENTS_COLLECTION = "attendance_events";
  const CONFIG_DOC = doc(db, "app_config", "employees");

  // ---------------------------------------------------------------
  // تحميل قائمة الموظفين من قاعدة البيانات (تُدار من صفحة admin.html)
  // ---------------------------------------------------------------
  const employeeSelect = document.getElementById("employeeSelect");

  async function loadEmployeeList() {
    let names = FALLBACK_EMPLOYEES;
    try {
      const snap = await getDoc(CONFIG_DOC);
      if (snap.exists() && Array.isArray(snap.data().names) && snap.data().names.length > 0) {
        names = snap.data().names;
      }
    } catch (err) {
      console.error("تعذر تحميل قائمة الموظفين، سيتم استخدام القائمة الاحتياطية", err);
    }

    employeeSelect.innerHTML = `<option value="" disabled selected>اختر اسمك من القائمة</option>`;
    names.forEach((name) => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      employeeSelect.appendChild(opt);
    });

    // استرجاع آخر موظف مُختار (تسهيل الاستخدام اليومي)
    const savedEmployee = localStorage.getItem("lastEmployee");
    if (savedEmployee && names.includes(savedEmployee)) {
      employeeSelect.value = savedEmployee;
      loadLastAction(savedEmployee);
    }
  }

  const statusEl = document.getElementById("status");
  const checkInBtn = document.getElementById("checkInBtn");
  const checkOutBtn = document.getElementById("checkOutBtn");
  const lastActionEl = document.getElementById("lastAction");

  function setStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.className = "status " + (kind || "");
    statusEl.classList.add("show");
    setTimeout(() => statusEl.classList.remove("show"), 3500);
  }

  function formatTime(date) {
    return date.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
  }

  function formatDate(date) {
    return date.toLocaleDateString("ar-EG", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  }

  async function recordEvent(type, extra) {
    const employee = employeeSelect.value;
    if (!employee) {
      setStatus("اختر اسمك الأول من القائمة", "error");
      return;
    }

    localStorage.setItem("lastEmployee", employee);

    try {
      await addDoc(collection(db, EVENTS_COLLECTION), {
        employeeName: employee,
        type: type,
        timestamp: serverTimestamp(),
        clientTime: new Date().toISOString(),
        ...(extra || {})
      });

      const labels = {
        check_in: "حضور",
        check_out: "انصراف",
        leave: "إجازة اليوم",
        permission: "استئذان"
      };
      const label = labels[type] || type;
      setStatus(`تم تسجيل ${label} بنجاح — ${formatTime(new Date())}`, "success");
      await loadLastAction(employee);
    } catch (err) {
      console.error(err);
      setStatus("حصل خطأ، حاول تاني (تأكد من الاتصال بالإنترنت)", "error");
    }
  }

  async function recordCheckInOut(type) {
    const btn = type === "check_in" ? checkInBtn : checkOutBtn;
    const originalText = btn.textContent;
    checkInBtn.disabled = true;
    checkOutBtn.disabled = true;
    btn.textContent = "جاري التسجيل...";
    await recordEvent(type);
    btn.textContent = originalText;
    checkInBtn.disabled = false;
    checkOutBtn.disabled = false;
  }

  async function loadLastAction(employee) {
    if (!employee) {
      lastActionEl.textContent = "";
      return;
    }
    try {
      const q = query(
        collection(db, EVENTS_COLLECTION),
        where("employeeName", "==", employee),
        orderBy("timestamp", "desc"),
        limit(1)
      );
      const snap = await getDocs(q);
      if (snap.empty) {
        lastActionEl.textContent = "لا يوجد تسجيل سابق";
        return;
      }
      const data = snap.docs[0].data();
      const labels = {
        check_in: "حضور",
        check_out: "انصراف",
        leave: "إجازة",
        permission: data.durationMinutes === "no_return"
          ? "استئذان بدون عودة"
          : `استئذان (${data.durationMinutes} دقيقة)`
      };
      const label = labels[data.type] || data.type;
      const ts = data.timestamp ? data.timestamp.toDate() : new Date(data.clientTime);
      lastActionEl.textContent = `آخر تسجيل: ${label} — ${formatTime(ts)}`;
    } catch (err) {
      console.error(err);
      lastActionEl.textContent = "";
    }
  }

  checkInBtn.addEventListener("click", () => recordCheckInOut("check_in"));
  checkOutBtn.addEventListener("click", () => recordCheckInOut("check_out"));
  employeeSelect.addEventListener("change", () => loadLastAction(employeeSelect.value));

  // ---------------------------------------------------------------
  // زرار الإجازة
  // ---------------------------------------------------------------
  const leaveBtn = document.getElementById("leaveBtn");
  leaveBtn.addEventListener("click", async () => {
    const employee = employeeSelect.value;
    if (!employee) {
      setStatus("اختر اسمك الأول من القائمة", "error");
      return;
    }
    if (!confirm(`تسجيل إجازة اليوم لـ "${employee}"؟`)) return;
    leaveBtn.disabled = true;
    await recordEvent("leave");
    leaveBtn.disabled = false;
  });

  // ---------------------------------------------------------------
  // زرار الاستئذان + نافذة اختيار المدة
  // ---------------------------------------------------------------
  const permissionBtn = document.getElementById("permissionBtn");
  const permissionModal = document.getElementById("permissionModal");
  const modalCancelBtn = document.getElementById("modalCancelBtn");

  permissionBtn.addEventListener("click", () => {
    const employee = employeeSelect.value;
    if (!employee) {
      setStatus("اختر اسمك الأول من القائمة", "error");
      return;
    }
    permissionModal.classList.add("show");
  });

  modalCancelBtn.addEventListener("click", () => {
    permissionModal.classList.remove("show");
  });

  permissionModal.addEventListener("click", (e) => {
    if (e.target === permissionModal) permissionModal.classList.remove("show");
  });

  document.querySelectorAll(".modal-option").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const duration = btn.dataset.duration; // "no_return" أو عدد الدقائق كنص
      permissionModal.classList.remove("show");
      await recordEvent("permission", { durationMinutes: duration });
    });
  });

  // تحميل قائمة الموظفين من قاعدة البيانات عند فتح الصفحة
  loadEmployeeList();

  // تحديث الساعة والتاريخ الحي
  const clockEl = document.getElementById("clock");
  const dateLineEl = document.getElementById("dateLine");
  function tickClock() {
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    dateLineEl.textContent = formatDate(now);
  }
  tickClock();
  setInterval(tickClock, 1000);
</script>

<style>
  :root {
    --bg: #1f2a24;
    --surface: #2a362e;
    --surface-raised: #344139;
    --paper: #f5f1e8;
    --paper-dim: #cfc9b8;
    --sage: #8fa876;
    --sage-bright: #a4c187;
    --clay: #c97b5b;
    --clay-bright: #db8d6c;
    --line: #3f4d43;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--paper);
    font-family: "Cairo", "Segoe UI", sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(143,168,118,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,123,91,0.07), transparent 45%);
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 24px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .eyebrow .farm-name {
    font-size: 14px;
    color: var(--sage-bright);
    font-weight: 600;
  }

  .eyebrow .clock {
    font-size: 14px;
    color: var(--paper-dim);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }

  .date-line {
    font-size: 13px;
    color: var(--paper-dim);
    margin-top: 2px;
    margin-bottom: 4px;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 12px 0 28px;
    line-height: 1.3;
  }

  label {
    display: block;
    font-size: 14px;
    color: var(--paper-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }

  select {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px;
    font-family: inherit;
    font-weight: 700;
    color: var(--paper);
    background: var(--surface-raised);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    margin-bottom: 6px;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23cfc9b8' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: left 14px center;
  }

  select:focus {
    outline: none;
    border-color: var(--sage);
  }

  .last-action {
    font-size: 13px;
    color: var(--paper-dim);
    min-height: 18px;
    margin-bottom: 22px;
  }

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  button.action {
    font-family: inherit;
    font-size: 18px;
    font-weight: 800;
    padding: 20px 8px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }

  button.action:active {
    transform: scale(0.96);
  }

  button.action:disabled {
    opacity: 0.6;
    cursor: default;
    transform: none;
  }

  #checkInBtn {
    background: var(--sage);
    color: #16201a;
  }

  #checkInBtn:hover:not(:disabled) { filter: brightness(1.08); }

  #checkOutBtn {
    background: var(--clay);
    color: #241209;
  }

  #checkOutBtn:hover:not(:disabled) { filter: brightness(1.08); }

  .secondary-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }

  button.action-secondary {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 13px 8px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--paper-dim);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }

  button.action-secondary:active { transform: scale(0.96); }
  button.action-secondary:hover { border-color: var(--sage); color: var(--sage-bright); }

  .status {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.25s ease, max-height 0.25s ease, padding 0.25s ease, margin 0.25s ease;
  }

  .status.show {
    opacity: 1;
    max-height: 60px;
    margin-top: 18px;
  }

  .status.success { background: rgba(143,168,118,0.18); color: var(--sage-bright); }
  .status.error { background: rgba(201,123,91,0.18); color: var(--clay-bright); }

  .footer-note {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--paper-dim);
    text-align: center;
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    button.action, .status { transition: none; }
  }

  /* ===================== نافذة اختيار الاستئذان ===================== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 17, 0.72);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px 20px;
  }

  .modal-card h2 {
    font-size: 18px;
    font-weight: 800;
    margin: 0 0 16px;
    text-align: center;
  }

  .modal-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }

  button.modal-option {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 12px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--surface-raised);
    color: var(--paper);
    cursor: pointer;
    transition: border-color 0.12s ease, transform 0.12s ease;
  }

  button.modal-option:active { transform: scale(0.97); }
  button.modal-option:hover { border-color: var(--sage); }

  button.modal-option[data-duration="no_return"] {
    border-color: rgba(201,123,91,0.5);
    color: var(--clay-bright);
  }

  button.modal-cancel {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: transparent;
    color: var(--paper-dim);
    cursor: pointer;
  }
  button.modal-cancel:hover { color: var(--paper); }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow">
      <span class="farm-name">تعليمات الترعة</span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
    <div class="date-line" id="dateLine"></div>

    <h1>سجّل حضورك أو انصرافك</h1>

    <label for="employeeSelect">اسمك</label>
    <select id="employeeSelect">
      <option value="" disabled selected>اختر اسمك من القائمة</option>
    </select>
    <div class="last-action" id="lastAction"></div>

    <div class="buttons">
      <button class="action" id="checkInBtn">✓ حضور</button>
      <button class="action" id="checkOutBtn">✕ انصراف</button>
    </div>

    <div class="secondary-buttons">
      <button class="action-secondary" id="leaveBtn">🏖 إجازة اليوم</button>
      <button class="action-secondary" id="permissionBtn">🕐 استئذان</button>
    </div>

    <div class="status" id="status"></div>

    <div class="footer-note">
      اضغط الزرار المناسب عند بداية أو نهاية يوم عملك فقط
    </div>
  </div>

  <!-- نافذة اختيار نوع الاستئذان -->
  <div class="modal-overlay" id="permissionModal">
    <div class="modal-card">
      <h2>نوع الاستئذان</h2>
      <div class="modal-options">
        <button class="modal-option" data-duration="no_return">استئذان بدون عودة</button>
        <button class="modal-option" data-duration="30">نص ساعة (30 دقيقة)</button>
        <button class="modal-option" data-duration="60">ساعة</button>
        <button class="modal-option" data-duration="120">ساعتين</button>
      </div>
      <button class="modal-cancel" id="modalCancelBtn">إلغاء</button>
    </div>
  </div>

</body>
</html>
